name: Publish VS Code Extension

on:
  push:
    tags:
      - 'v*'  # Trigger on pushing version tags (e.g., v1.0.0)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install vsce
        run: npm install -g @vscode/vsce

      # vsce reads the PAT from VSCE_PAT and publishes the version in
      # package.json, so remember to bump it before tagging.
      - name: Publish the Extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish

